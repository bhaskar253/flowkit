name: FlowKit CI

on:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  test:

    name: FlowKit CI - ${{ matrix.os }}

    runs-on: ${{ matrix.os }}


    strategy:

      fail-fast: false

      matrix:

        os:
          - ubuntu-latest
          # - windows-latest
          # - macos-latest

        go:
          # - "1.20.x"
          # - "1.21.x"
          # - "1.22.x"
          # - "1.23.x"
          # - "1.24.x"
          # - "1.25.x"
          - "1.26.x"


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true


      - name: Display Go Version
        run: |
          go version


      - name: Format Check
        shell: bash
        run: |
          files=$(gofmt -l .)

          if [ -n "$files" ]; then
            echo "The following files need gofmt:"
            echo "$files"
            exit 1
          fi


      - name: Vet
        run: |
          go vet ./...


      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest


      - name: Test
        run: |
          go test ./...


      - name: Build
        run: |
          go build ./...